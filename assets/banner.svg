<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GuessNova banner</title>
  <desc id="desc">GuessNova branding banner for repository documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b16"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#bg)"/>
  <circle cx="190" cy="180" r="96" fill="none" stroke="url(#accent)" stroke-width="10"/>
  <text x="190" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="92" font-weight="700" fill="#f8fafc">#?</text>
  <text x="340" y="165" font-family="system-ui,sans-serif" font-size="82" font-weight="750" fill="#f8fafc">GuessNova</text>
  <text x="344" y="225" font-family="system-ui,sans-serif" font-size="30" fill="#c4b5fd">Number Guessing, Supernova Style</text>
  <text x="344" y="274" font-family="system-ui,sans-serif" font-size="22" fill="#94a3b8">Made by the Sanskar · Open source · Privacy first</text>
</svg>
