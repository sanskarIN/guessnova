name: Feature request
description: Suggest a privacy-preserving improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This can remain usable offline.
        - label: This does not require hidden analytics or tracking.
        - label: This can be made accessible without color-only cues.
