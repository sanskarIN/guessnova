name: Temporary release readiness handoff sync

on:
  push:
    branches:
      - release/v1.5-readiness-v2-entry-20260824

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'sanskarIN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.5-readiness-v2-entry-20260824
      - name: Synchronize canonical records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, marker: str, replacement: str, guard: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if guard in content:
                  return
              if marker not in content:
                  raise SystemExit(f"required marker missing in {path}: {marker!r}")
              target.write_text(content.replace(marker, replacement, 1), encoding="utf-8")

          replace_once(
              "CHANGELOG.md",
              "### Added\n\n",
              "### Added\n\n"
              "- Machine-readable manual release-evidence manifests, a strict evidence verifier, and a repository-local release-readiness report for the v1.5-to-v2 entry path.\n",
              "Machine-readable manual release-evidence manifests",
          )
          replace_once(
              "CHANGELOG.md",
              "### Changed\n\n",
              "### Changed\n\n"
              "- Tagged releases now fail fast on incomplete manual evidence; verification/package jobs are read-only and only the final publication job receives repository write permission.\n",
              "Tagged releases now fail fast on incomplete manual evidence",
          )

          roadmap_old = "- [ ] Require exact-head CI, Security, and CodeQL success for the final release-candidate head.\n"
          roadmap_new = (
              "- [x] Require exact-head CI, Security, and CodeQL success for the final release-candidate head.\n"
              "- [x] Add a machine-readable manual-evidence manifest and block tagged publication while it is pending or incomplete.\n"
              "- [x] Scope tagged-release repository write permission to the final publication job only.\n"
          )
          replace_once(
              "ROADMAP.md",
              roadmap_old,
              roadmap_new,
              "block tagged publication while it is pending or incomplete",
          )

          handoff = """## 2026-08-24 continuation — release readiness after PR #14 merge\n\nPR #14 was merged into `main` as `9e3c24db7653b500aacb31b68a59739f586e8059` after its final head passed CI, Security, CodeQL, Python/browser tests, Ruff, strict mypy, smoke checks, and Ubuntu/Windows/macOS built-wheel verification. The engineering reconciliation is therefore complete; release publication remains intentionally separate from merge.\n\nA follow-up branch, `release/v1.5-readiness-v2-entry-20260824`, adds a machine-readable manual release-evidence contract under `docs/release_evidence/`, a strict `verify_manual_release_evidence.py` gate, and `release_readiness.py` for non-fabricated repository-local status reporting. The committed v1.5 evidence record remains `pending`.\n\nTagged-release automation now checks that evidence before release verification proceeds. Verification and platform-package jobs are read-only, while `contents: write` is scoped only to the final publication job. Release concurrency also prevents duplicate publication jobs for the same tag from racing.\n\nThe 2.0 roadmap now records the true entry state: reconciliation, automated quality/security gates, compatibility baseline, and release-safety tooling are complete; truthful manual keyboard/accessibility review, signed-off screenshot/demo capture, the 1.5.0 metadata advance, and the final v1.5.0 tag remain pending. No 2.0 feature work or compatibility-version bump is claimed before those entry gates are complete.\n\n---\n\n"""
          replace_once(
              "what_changed.md",
              "## 2026-08-24 continuation — v1.5 reconciliation and 2.0 preparation\n",
              handoff + "## 2026-08-24 continuation — v1.5 reconciliation and 2.0 preparation\n",
              "## 2026-08-24 continuation — release readiness after PR #14 merge",
          )
          PY
      - name: Commit synchronized records
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Canonical records already synchronized."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add CHANGELOG.md ROADMAP.md what_changed.md
          git commit -m "docs(handoff): sync release readiness and v2 entry status"
          git push origin HEAD:release/v1.5-readiness-v2-entry-20260824
