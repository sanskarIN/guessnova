name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/guessnova
      - name: Python tests
        run: pytest --cov=guessnova --cov-report=term-missing --cov-report=xml
      - name: Browser engine tests
        run: node --test tests/web/*.mjs
      - name: Browser JavaScript syntax
        run: |
          node --check src/guessnova/web/app.js
          node --check src/guessnova/web/game-engine.mjs
          node --check src/guessnova/web/sw.js
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Release metadata
        run: python scripts/verify_release_metadata.py
      - name: Smoke test
        run: python scripts/smoke_test.py

  platform-package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        shell: bash
        run: python -m twine check dist/*
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify game CLI entry point
        run: python -m guessnova --help
      - name: Verify Textual workspace import
        run: python -c "from guessnova.tui import GuessNovaApp; print(GuessNovaApp.TITLE)"
      - name: Verify primary doctor route
        run: guessnova doctor --help
      - name: Verify standalone doctor entry point
        run: guessnova-doctor --help
      - name: Verify doctor version
        run: guessnova-doctor --version
      - name: Verify web entry points
        run: |
          guessnova web --help
          guessnova-web --help
      - name: Verify bundled PWA assets
        run: python -c "from guessnova.web_server import WEB_ROOT; required=('index.html','sw.js','manifest.webmanifest','icon-192.png','icon-512.png'); assert all(WEB_ROOT.joinpath(name).is_file() for name in required); print('PWA assets OK')"
      - name: Run smoke test
        run: python scripts/smoke_test.py
