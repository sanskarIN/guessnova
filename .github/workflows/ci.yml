name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/guessnova
      - name: Tests
        run: pytest --cov=guessnova --cov-report=term-missing --cov-report=xml
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Release metadata
        run: python scripts/verify_release_metadata.py
      - name: Smoke test
        run: python scripts/smoke_test.py

  platform-package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        shell: bash
        run: python -m twine check dist/*
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify game CLI entry point
        run: python -m guessnova --help
      - name: Verify stable Textual workspace import
        run: python -c "from guessnova.tui import GuessNovaApp; print(GuessNovaApp.TITLE)"
      - name: Verify shipped challenge Textual app import
        run: python -c "from guessnova.tui_challenge_app import GuessNovaApp; print(GuessNovaApp.TITLE)"
      - name: Verify primary doctor route
        run: guessnova doctor --help
      - name: Verify standalone doctor entry point
        run: guessnova-doctor --help
      - name: Verify doctor version
        run: guessnova-doctor --version
      - name: Run smoke test
        run: python scripts/smoke_test.py
