name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install quality dependencies
        run: python -m pip install -e '.[dev]' pip-audit build twine
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG_VERSION" = "$PROJECT_VERSION"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/guessnova
      - name: Tests
        run: pytest --cov=guessnova --cov-report=term-missing
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py
      - name: Smoke test
        run: python scripts/smoke_test.py
      - name: Dependency audit
        run: pip-audit

  platform-package:
    name: release package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        shell: bash
        run: python -m twine check dist/*
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Verify game CLI entry point
        run: python -m guessnova --help
      - name: Verify Textual workspace import
        run: python -c "from guessnova.tui import GuessNovaApp; print(GuessNovaApp.TITLE)"
      - name: Verify primary doctor route
        run: guessnova doctor --help
      - name: Verify standalone doctor entry point
        run: guessnova-doctor --help
      - name: Verify doctor version
        run: guessnova-doctor --version
      - name: Run smoke test
        run: python scripts/smoke_test.py

  build-release:
    needs: [verify, platform-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build release artifacts
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
