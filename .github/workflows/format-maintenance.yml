name: Temporary Ruff formatting maintenance

on:
  push:
    branches:
      - release/v1.5-v2-prep-20260824

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'sanskarIN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.5-v2-prep-20260824
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned formatter
        run: python -m pip install ruff==0.12.12
      - name: Format repository Python sources
        run: ruff format .
      - name: Commit formatting migration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository already matches Ruff 0.12.12 formatting."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add .
          git commit -m "style: format Python sources with Ruff 0.12.12"
          git push origin HEAD:release/v1.5-v2-prep-20260824
